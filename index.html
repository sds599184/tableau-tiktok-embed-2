<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            width: 100%;
        }

        #tiktok-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }
    </style>
</head>

<body>

<div id="tiktok-container"></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get("url");

    const match = videoUrl
        ? videoUrl.match(/\/video\/(\d+)/)
        : null;

    if (videoUrl && match) {

        const videoId = match[1];

        const embed = document.createElement("blockquote");

        embed.className = "tiktok-embed";
        embed.setAttribute("cite", videoUrl);
        embed.setAttribute("data-video-id", videoId);
        embed.style.maxWidth = "605px";
        embed.style.minWidth = "325px";

        document
            .getElementById("tiktok-container")
            .appendChild(embed);

        const script = document.createElement("script");
        script.src = "https://www.tiktok.com/embed.js";
        script.async = true;

        document.body.appendChild(script);

    } else {

        document
            .getElementById("tiktok-container")
            .innerText = "No valid TikTok URL specified.";

    }
</script>

</body>
</html>
